<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donator Login</title>
    <link rel="stylesheet" href="../Design/style.css">
    <link rel="stylesheet" href="donator.css">

</head>
<body class="simple-page">
    <div class="simple-box form-box">
        <form class="loginForm">
            <div class="form-group">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" placeholder="Enter your Email">
                <span id="loginEmailError" class="error"></span>
            </div>
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password">
                <span id="loginPassError" class="error"></span>
            </div>
            <input type="submit" class="btn form-button" value="Login">
            <div id="loginPassError" class="error"></div>
        </form>
        <p class="footer-note">New donator?<a href="register.html">Create account</a></p>
        <p class="footer-note"><a href="index.html">Back to Home</a></p>
    </div>
    <script src="JS/index.js"></script>
    
</body>
</html>
