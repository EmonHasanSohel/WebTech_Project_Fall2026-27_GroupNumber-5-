<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Disaster Management</title>
    <link rel="stylesheet" href="../Design/style.css">
</head>
<body>

    <div class="form-container">
        <div style="text-align: center; margin-bottom: 15px;">
            <a href="../index.html">
                <img src="../Images/logo.png" alt="SAHAYATA Logo" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover;">
            </a>
        </div>

        <h2 style="text-align: center; color: #2c3e50;">Admin Login</h2>

        <form onsubmit="return validateAdminLogin()">
            <fieldset>
                <legend>Administrator</legend>
                <table>
                    <tr>
                        <td><label for="loginEmail">Email:</label></td>
                        <td>
                            <input type="text" id="loginEmail" placeholder="Enter Admin Email">
                            <p id="loginEmailError" class="error-text"></p>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="loginPass">Password:</label></td>
                        <td>
                            <input type="password" id="loginPass" placeholder="Enter Password">
                            <p id="loginPassError" class="error-text"></p>
                        </td>
                    </tr>
                </table>

               
                <div style="display: flex; justify-content: space-between; align-items: stretch; margin-top: 15px; gap: 10px;">
                    <input type="submit" value="Login" class="btn btn-admin" style="flex: 1; width: 50%; height: 45px; padding: 0; font-size: 16px; margin: 0;">
                    <button type="button" onclick="toggleForgotBox()" class="btn" style="flex: 1; width: 50%; height: 45px; padding: 0; font-size: 16px; margin: 0; background-color: #e67e22; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">Forgot Password?</button>
                </div>
            </fieldset>
        </form>

        <div id="forgotPasswordSection" style="display: none; margin-top: 20px;">
            <fieldset style="border: 1px solid #e67e22; background-color: #fef9e7;">
                <legend style="color: #d35400;">Reset Password with OTP</legend>
                
            
                <table>
                    <tr>
                        <td><label for="recoveryContact">Email / Mobile:</label></td>
                        <td>
                            <input type="text" id="recoveryContact" placeholder="Registered Email or Mobile">
                            <p id="recoveryContactErr" class="error-text"></p>
                        </td>
                    </tr>
                </table>
                <div style="text-align: right; margin-bottom: 10px;">
                    <button type="button" onclick="sendResetOTP()" style="padding: 8px 15px; background-color: #2980b9; color: white; border: none; border-radius: 4px; cursor: pointer;">Send OTP</button>
                </div>

                
                <div id="otpVerifyArea" style="display: none;">
                    <table>
                        <tr>
                            <td><label for="enteredOtp">Enter OTP:</label></td>
                            <td>
                                <input type="number" id="enteredOtp" placeholder="4-digit OTP">
                                <p id="otpErr" class="error-text"></p>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="resetNewPass">New Password:</label></td>
                            <td>
                                <input type="password" id="resetNewPass" placeholder="Min 8 chars (Strong)">
                                <p id="resetNewPassErr" class="error-text"></p>
                            </td>
                        </tr>
                    </table>
                    <div style="text-align: center; margin-top: 10px;">
                        <button type="button" onclick="verifyAndResetPass()" class="btn btn-admin" style="background-color: #27ae60;">Verify & Reset Password</button>
                    </div>
                </div>
            </fieldset>
        </div>

        <p style="text-align: center; margin-top: 15px;">
            Don't have an admin account? <a href="AdminRegistration.html">Register Here</a>
        </p>
    </div>

    <script src="JS/AdminLogin.js"></script>
</body>
</html>
